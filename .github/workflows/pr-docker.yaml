name: CI - Docker
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read # Required: allow read access to the content for analysis.

concurrency:
  group: ${{ github.ref }}-docker-build
  cancel-in-progress: true

jobs:
  docker:
    name: Docker
    permissions:
      contents: read
      statuses: write
      packages: write
      id-token: write
    uses: davidnlopes/reusable-workflows/.github/workflows/docker.yaml@v1
    with:
      push: false
