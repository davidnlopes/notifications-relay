name: CI - Docker
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read # Required: allow read access to the content for analysis.

concurrency:
  group: ${{ github.ref }}-docker-build
  cancel-in-progress: true

jobs:
  docker:
    name: Docker
    uses: davidnlopes/Reusable.Workflows/.github/workflows/docker-build.yaml@v1
    with:
      dockerFilePath: Dockerfile
