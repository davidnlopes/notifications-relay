name: CI - Release
on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Create
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.release.outputs.new_release_published }}
      new_release_version: ${{ steps.release.outputs.new_release_version }}
    steps:
      # The built-in token cannot bypass the ruleset that restricts creating v* tags.
      - name: Create release token
        id: release-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.release-token.outputs.token }}

      - name: Semantic Release
        id: release
        uses: cycjimmy/semantic-release-action@ad51787758d9654d5a75150a89a6fa9b3ccef95e # v8.1.4
        env:
          GITHUB_TOKEN: ${{ steps.release-token.outputs.token }}

  # Runs in this workflow because tags that GITHUB_TOKEN pushes do not trigger other workflows.
  image:
    name: Publish image
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    permissions:
      contents: read
      statuses: write
      packages: write
      id-token: write
    uses: davidnlopes/Reusable.Workflows/.github/workflows/docker.yaml@v1
    with:
      registry: ghcr.io
      push: true
      version: ${{ needs.release.outputs.new_release_version }}
